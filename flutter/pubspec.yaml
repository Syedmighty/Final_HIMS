name: hims_flutter
description: Hotel Inventory Management System - Flutter Frontend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # UI & Theming
  google_fonts: ^6.1.0

  # Networking
  http: ^1.2.0

  # Formatting & Localization
  intl: ^0.19.0

  # Local Database (Offline-First)
  drift: ^2.16.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # Code Generation
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.8
  drift_dev: ^2.16.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  # Assets
  # assets:
  #   - images/
  #   - assets/

  # Fonts (using Google Fonts package instead)
